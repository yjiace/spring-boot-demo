spring:
  datasource:
    driver-class-name: net.sf.log4jdbc.DriverSpy
    url: jdbc:log4jdbc:postgresql://localhost:5432/spring-boot-demo?useUnicode=true&characterEncoding=UTF-8
    username: postgres
    password: 123456
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-test-query: SELECT 1
      max-lifetime: 18000
      connection-timeout: 30000
  jackson:
    serialization:
      indent-output: true
    time-zone: GMT+8
  jpa:
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: localhost
      password: 123456
      port: 6379
      database: 0
      jedis:
        pool:
          max-idle: 3
          max-wait: 30
          max-active: 10

jwt:
  # 是否开启鉴权，当为false时，表示通过全部请求
  enable: false
  # redis中保存token的键名称
  private_key: 
  public-key: MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCti+fc/RbSSMoW1tFqunRMJAPFLgOvevPrCoDdkkgN9nmienxZN5J/CCvRv6Xr+fdrDw7/QkxhezUd+V31maYpsPTKJL5503gLdY0EVmn2s+9xJtWtjRmw1i+16Ghrp/3AAL4fJG6tSOiYXwdZ84oY9Ukhpx4KwOuF6RJde7PWGwIDAQAB
  # token过期时间（分钟）
  expiration: 120
  # 是否单点登录
  sso: true
  # 只要登录即可访问
  auth-url:
    - /user/logout
    - /user/updatePwd
    - /user/refresh
  # 匿名访问
  anon-url:
    - /open/**
    - /captcha
    - /login/**
    - /favicon.ico
